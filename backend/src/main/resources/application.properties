spring.application.name=backend

spring.profiles.active=dev

spring.datasource.url=jdbc:postgresql://localhost:5432/movies_platform
spring.datasource.username=postgres
spring.datasource.password=Asset@99a
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# dev only
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL95Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

jwt.secret=HardToGuess
jwt.expiration-minutes=30
ANGULAR_APP_URL=https://localhost:4200

# HTTPS / TLS (dev)
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-alias=movies
